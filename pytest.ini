[pytest]
testpaths = tests
# app/ is deployed flat (Dockerfile: COPY app/ /app/, `uvicorn main:app`) and its modules import each other by bare
# name (`import cfgparse`, `from db import db`). Tests therefore put app/ itself on sys.path and import flat as well
# (`import changes`, `from cfgparse import ...`), so every module exists exactly once and monkeypatching it affects
# the code under test. Do not import `app.<module>`, and do not add a root-level conftest.py: it would put the repo
# root on sys.path, make that import resolve silently, and bring back a second copy of each module.
pythonpath = app
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
